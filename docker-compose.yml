# ═══════════════════════════════════════════════════════════════
# AI Document Reading — Docker Compose
# Kullanım: docker compose up --build
# ═══════════════════════════════════════════════════════════════

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-doc-reading
    ports:
      - "${UVICORN_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Geliştirme modu: kaynak kodu mount et ve --reload kullan
    # volumes:
    #   - ./src:/app/src:ro
    # command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
